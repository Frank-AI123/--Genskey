<script>
/* DEMO_SCRIPT */
const $=s=>document.querySelector(s);
const demoMode=document.documentElement.dataset.accountMode==='demo';
if(demoMode)$('#demo-banner').hidden=false;
const localAccounts=document.documentElement.dataset.accountMode==='local';
const accountActions=localAccounts?'<span class="account-actions"><a href="/account/password">修改密码</a><form action="/signout-with-chatgpt" method="post"><button>退出</button></form></span>':'<a href="/signout-with-chatgpt" target="_top">退出</a>';
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'});
const yuan=v=>fmt.format(v/100);
const pct=(n,d)=>d?(100*n/d).toFixed(1)+'%':'—';
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const days=(a,b)=>Math.max(0,Math.round((Date.parse(a)-Date.parse(b))/86400000));
const balance=r=>r.amount-r.paid;
const sum=(a,f)=>a.reduce((s,v)=>s+f(v),0);
const roleName={admin:'管理员',finance:'财务人员',viewer:'只读人员',budget:'预算填报员'};
const specs={
 ar:{title:'应收账款',fields:['单据编号','客户名称','开单日期','到期日期','应收金额','已收金额'],sample:['AR-001','示例客户','2026-11-01','2026-12-01',12000,3000]},
 report:{title:'月度财务报表',fields:['月份','营业收入','营业成本','期间费用','经营现金流净额'],sample:['2026-11',100000,60000,20000,16000]}
};
let state,tab=location.hash==='#budgets'?'budgets':location.hash.startsWith('#ar')?'ar':location.hash==='#skills'?'skills':location.hash==='#ai-models'?'ai-models':localAccounts&&location.hash==='#members'?'members':'dashboard',period='',statement='balance',query='',filter='all',kind='ar',pending;
let erpPage=1,erpQuery='',erpRouteKey='',erpLegacy=false;
const selectedCustomer=()=>location.hash.startsWith('#ar?')?new URLSearchParams(location.hash.slice(4)).get('customer')||'':'';
const periodTabs=['dashboard','statements','revenue','ar'];
const statementTabs=[['balance','资产负债表'],['income','利润表'],['cashflow','现金流量表']];
const currentPeriod=()=>today().slice(0,7);
function periods(){
 return [...new Set([...state.report.map(r=>r.id),...state.ar.map(r=>r.issued.slice(0,7)),...(state.erp?.months??[]).map(r=>r.id)])].sort();
}
function periodControl(){
 const year=period.slice(0,4);
 const years=[...new Set([currentPeriod(),period,...periods()].map(v=>v.slice(0,4)))].sort().reverse();
 return '<div class="panel tools period-control" role="group" aria-label="数据期间"><label>年份<select id="periodYear">'+years.map(y=>'<option '+(y===year?'selected':'')+'>'+y+'</option>').join('')+'</select></label><div role="group" aria-label="月份" class="tools">'+Array.from({length:12},(_,i)=>{
  const value=year+'-'+String(i+1).padStart(2,'0');
  return '<button data-period="'+value+'" aria-pressed="'+(value===period)+'" class="'+(value===period?'active':'')+'">'+(i+1)+'月</button>';
 }).join('')+'</div></div>';
}
const periodReceivables=()=>state.ar.filter(r=>r.issued.startsWith(period+'-'));
const canWrite=()=>['admin','finance'].includes(state.role);
const notify=(message,bad=false)=>{$('#notice').textContent=message;$('#notice').className=bad?'error':'ok'};
function setTabHash(hash){
 if(location.protocol==='file:'){
  if(location.hash!==hash)location.hash=hash;
 }else history.replaceState(null,'',hash||location.pathname+location.search);
}
async function api(path,data){
 if(demoMode)return demoApi(path,data);
 const r=await fetch('/api/'+path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
 const body=await r.json();
 if(localAccounts&&r.status===401)location.replace('/signin-with-chatgpt');
 if(!r.ok)throw Error(body.error);
 return body;
}
function applyState(next){
 if(state&&(state.email!==next.email||next.role==='budget'&&state.role!=='budget'))biResetSession();
 state=next;
}
async function refresh(){applyState(await api('state'));render()}
const title=(heading,sub)=>'<h1>'+heading+'</h1><p class="muted">'+sub+'</p>';
const card=(name,value,detail)=>'<div class="card"><small>'+name+'</small><strong>'+value+'</strong><small>'+detail+'</small></div>';
const grid=(heads,rows)=>rows.length?'<div class="scroll"><table><thead><tr>'+heads.map(s=>'<th>'+s+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(s=>'<td>'+s+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<p class="empty">暂无符合条件的数据</p>';
const erpMoney=v=>v==null?'—':yuan(v);
const knownGross=r=>r.gross==null?'—':yuan(r.gross)+(r.missing?'（部分）':'');
function arMetric(id,label,value,detail,formula,explanation,example){
 const tip='ar-metric-'+id;
 return '<article class="card ar-metric"><div class="ar-metric-label"><small>'+esc(label)+'</small><button type="button" class="ar-metric-help" aria-label="'+esc(label+'的计算说明')+'" aria-controls="'+tip+'" aria-expanded="false">?</button></div>'+
 '<strong>'+yuan(value)+'</strong><small>'+esc(detail)+'</small><div id="'+tip+'" class="ar-metric-tip" hidden><b>计算口径</b><p>'+esc(formula)+'</p><p>'+esc(explanation)+'</p>'+(example?'<p>'+esc(example)+'</p>':'')+'</div></article>';
}
function arMetricCards(s){
 return '<div class="cards">'+
 arMetric('book','账面期末余额',s.book,s.book_customers+' 个客户 · 来源：应收余额表','账面期末余额 = 各客户账面期末应收余额之和。','取《应收余额》'+s.as_of+'的期末快照。同一客户有多条记录时，先按客户汇总。')+
 arMetric('paid','已分配回款',s.paid,s.period_start+' 至 '+s.as_of+' · 已分配到订单','已分配回款 = 统计期内已分配至各笔应收的回款金额之和。','依次按订单号、D 列指定月份分配。两者都未指定时，按实际收款月份，在同客户、同收款主体的当月订单内先进先出。')+
 arMetric('estimate','订单测算余额',s.estimated,'当期财务应收减已分配回款','订单测算余额 = 已审核财务应收按订单冲销后的应收金额合计 − 已分配回款。','按 ERP 业务日期取统计期内的财务应收。暂估应收和期初未结余额另行核对。',yuan(s.estimated+s.paid)+' − '+yuan(s.paid)+' = '+yuan(s.estimated))+
 arMetric('terms','订单缺账期余额',s.missing_terms,'供订单核对','订单缺账期余额 = 无法确认信用期的订单未结余额之和。','这部分金额已计入订单测算余额。信用期为 0 天时，到期日按 ERP 业务日期计算。')+
 arMetric('difference','账面与订单测算净差',s.difference,'供期末余额核对','账面与订单测算净差 = 账面期末余额 − 订单测算余额。','按平台全量汇总计算，可能含期初未结应收、实际核销和调整差异。',yuan(s.book)+' − '+yuan(s.estimated)+' = '+yuan(s.difference))+'</div>';
}
function showArMetricHelp(card,open){
 if(open){for(const other of document.querySelectorAll('.ar-metric'))if(other!==card)showArMetricHelp(other,false)}
 else delete card.dataset.pinned;
 card.querySelector('.ar-metric-help').setAttribute('aria-expanded',String(open));
 card.querySelector('.ar-metric-tip').hidden=!open;
}
function bindArMetricHelp(){
 for(const card of document.querySelectorAll('.ar-metric')){
  const button=card.querySelector('.ar-metric-help');
  card.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')showArMetricHelp(card,true)});
  card.addEventListener('pointerleave',()=>{if(!card.dataset.pinned&&!button.matches(':focus-visible'))showArMetricHelp(card,false)});
  button.addEventListener('focus',()=>{if(button.matches(':focus-visible'))showArMetricHelp(card,true)});
  button.addEventListener('blur',()=>{if(!card.matches(':hover'))showArMetricHelp(card,false)});
  button.addEventListener('click',()=>{
   const pin=!card.dataset.pinned;
   showArMetricHelp(card,pin);
   if(pin)card.dataset.pinned='1';
  });
 }
}
function erpTrend(){
 const rows=(state.erp?.months??[]).filter(r=>r.id.startsWith(period.slice(0,4)));
 if(!rows.length)return '';
 const maximum=Math.max(1,...rows.map(r=>Math.abs(r.net)));
 const current=rows.find(r=>r.id===period);
 return '<div class="panel erp-panel"><h2>ERP 月度收入 · '+period.slice(0,4)+' 年</h2><p class="muted">按 ERP 业务日期归月，不含税收入取本位币；未填销售订单号的明细标为「其他」。</p>'+
 (current?'<div class="cards">'+card('所选月不含税收入',yuan(current.net),current.id)+card('所选月价税合计',knownGross(current),current.missing?'部分行缺少可核实的含税金额':'人民币本位币')+card('所选月收入明细',current.lines.toLocaleString('zh-CN')+' 行','其中其他 '+current.other.toLocaleString('zh-CN')+' 行')+'</div>':'')+
 grid(['月份','不含税收入','价税合计（已知）','不含税收入对比','明细'],rows.map(r=>[r.id,yuan(r.net),knownGross(r),'<div class="bar" style="min-width:100px" aria-hidden="true"><div class="fill" style="width:'+100*Math.abs(r.net)/maximum+'%"></div></div>','<button type="button" data-erp-month="'+r.id+'">查看明细</button>']))+
 (rows.some(r=>r.derived||r.missing)?'<p class="muted">部分含税金额按人民币原币价税合计或本位币净额加税额补足；仍缺数据的行未计入含税合计。</p>':'')+'</div>';
}
function erpReceivables(){
 const s=state.erp.snapshot, cust=selectedCustomer();
 return title(cust?esc(cust):'应收账款',`截至 ${s.as_of} · ERP 应收核对 · 人民币元`)+
 (state.ar.length?'<p><button type="button" data-erp-legacy="1">查看原有应收台账</button></p>':'')+

function csv(text){
 const rows=[];let row=[],field='',quote=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(quote){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quote=false;else field+=c}
  else if(c==='"'&&!field)quote=true;
  else if(c===','){row.push(field);field=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;rows.push([...row,field]);row=[];field=''}
  else field+=c;
 }
 if(quote)throw Error('CSV 中有未闭合的引号');
 rows.push([...row,field]);return rows;
}
async function xlsx(buffer,company=false){
 const d=new DataView(buffer), bytes=new Uint8Array(buffer), dec=new TextDecoder();

 while(end>=Math.max(0,d.byteLength-65557)&&d.getUint32(end,true)!==0x06054b50)end--;
 if(end<0||d.getUint32(end,true)!==0x06054b50)throw Error('无法读取 XLSX 文件');
 let off=d.getUint32(end+16,true);const files=new Map();
 for(let n=0;n<d.getUint16(end+10,true);n++){
  if(d.getUint32(off,true)!==0x02014b50)throw Error('XLSX 压缩目录损坏');
  const len=d.getUint16(off+28,true),name=dec.decode(bytes.subarray(off+46,off+46+len));
  files.set(name,{method:d.getUint16(off+10,true),size:d.getUint32(off+20,true),unpacked:d.getUint32(off+24,true),at:d.getUint32(off+42,true)});
  off+=46+len+d.getUint16(off+30,true)+d.getUint16(off+32,true);
 }

  if(f.unpacked>12000000)throw Error('工作表过大');

  let data=bytes.subarray(start,start+f.size);
  if(f.method===8){
   const reader=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
   const chunks=[];let size=0;
   for(;;){const {done,value}=await reader.read();if(done)break;size+=value.length;if(size>12000000){await reader.cancel();throw Error('工作表过大')}chunks.push(value)}
   data=await new Blob(chunks).arrayBuffer();
  }else if(f.method!==0)throw Error('不支持此 XLSX 压缩方式');
  const doc=new DOMParser().parseFromString(dec.decode(data),'application/xml');
  if(doc.querySelector('parsererror'))throw Error('无法解析 XLSX 内容');return doc;
 }
 const book=await xml('xl/workbook.xml'),rels=await xml('xl/_rels/workbook.xml.rels');

  const target=relationships.find(r=>r.getAttribute('Id')===relId)?.getAttribute('Target');
  const path=target?new URL(target,'https://xlsx.invalid/xl/workbook.xml').pathname.slice(1):'xl/worksheets/sheet1.xml';
  const sheet=await xml(path);
  if(!sheet||(!target&&company))throw Error('找不到工作表 '+(ref?.getAttribute('name')||''));
  return Array.from(sheet.getElementsByTagName('row'),row=>{
  const values=[];
  for(const c of row.getElementsByTagName('c')){
   const letters=c.getAttribute('r')?.match(/^[A-Z]+/)?.[0];if(!letters)continue;
   let col=0;for(const ch of letters)col=26*col+ch.charCodeAt(0)-64;

   values[col-1]=t==='e'?{error:v}:t==='s'?shared[Number(v)]:t==='inlineStr'?rich(c):v&&(!t||t==='n')?{serial:Number(v),date1904}:v;
  }return values;
 });
 }
 const names={balance:'合并资产负债表',income:'合并利润表',cashflow:'合并现金流量表'};
 if(!company)return readSheet(sheets[0]);
 if(company==='auto'&&!Object.values(names).some(name=>sheets.some(s=>s.getAttribute('name').includes(name))))return readSheet(sheets[0]);

const str=v=>String(v?.serial??v??'').trim();
function dateValue(v,length){
 if(typeof v==='object'&&v&&Number.isFinite(v.serial)&&v.serial>=0&&v.serial<2958466){
  const base=v.date1904?'1904-01-01':v.serial<60?'1899-12-31':'1899-12-30';
  return new Date(Date.parse(base)+Math.floor(v.serial)*86400000).toISOString().slice(0,length);
 }
 const s=str(v).replaceAll('/','-');
 const m=s.match(/^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?$/);
 return m&&Number(m[2])>=1&&Number(m[2])<=12&&(length===7||m[3])?[m[1],m[2].padStart(2,'0'),...(length===10?[m[3].padStart(2,'0')]:[])].join('-'):'';

function cents(v,negative=false){

async function parse(file,type){

 }

 if(!Array.isArray(table))return companyRows(table);

 if(indexes.includes(-1))throw Error('缺少列：'+fields.filter((_,i)=>indexes[i]<0).join('、'));
 const seen=new Set(),out=[];
 for(const [i,row] of table.slice(1).entries()){
  if(!row.some(v=>str(v)))continue;
  try{
   const [a,b,c,d,e,f]=indexes.map(n=>row[n]);
   const r=type==='ar'?{id:str(a),customer:str(b),issued:dateValue(c,10),due:dateValue(d,10),amount:cents(e),paid:cents(f)}:{id:dateValue(a,7),revenue:cents(b),cost:cents(c),expense:cents(d),cash:cents(e,true)};
   const validDate=v=>v&&Number.isFinite(Date.parse(v))&&new Date(v).toISOString().slice(0,10)===v;
   if(!r.id||r.id.length>120||seen.has(r.id))throw Error('编号或月份为空、过长或重复');
   if(type==='ar'&&(!r.customer||r.customer.length>120||!validDate(r.issued)||!validDate(r.due)||r.due<r.issued||!r.amount||r.paid>r.amount))throw Error('请核对客户名称、日期和应收金额');
   seen.add(r.id);out.push(r);
  }catch(e){throw Error('第 '+(i+2)+' 行：'+e.message)}
 }

}
function companyRows(sheets){
 const clean=v=>str(v).replace(/\s/g,'');
 const starts=(value,name)=>clean(value).replace(/^(?:[一二三四五六七八九十]+、|[加减][：:])/,'').startsWith(name);
 function amount(v){
  if(v?.error)throw Error('Excel 单元格包含错误，请在 Excel 重算后保存');
  if(!str(v))return null;
  const n=typeof v==='object'?v.serial:Number(str(v).replaceAll(',',''));
  const scaled=Math.round(Math.abs(n)*100)*Math.sign(n);
  if(!Number.isSafeInteger(scaled)||Math.abs(scaled)>100000000000000)throw Error('报表数值无效');
  return scaled;
 }
 function optional(v){try{return amount(v)}catch{return null}}
 const close=sheets.income.find(row=>dateValue(row[0],10));
 const period=close&&dateValue(close[0],7);
 if(!period)throw Error('合并利润表缺少报表日期');
 const [year,last]=period.split('-').map(Number);
 if(year<2000||year>2099)throw Error('报表日期年份无效');
 const headings=rows=>rows.find(row=>row.includes('1月')&&row.includes('12月'));
 const cumulativeCol=row=>row.findIndex(v=>clean(v)==='本年累计');
 const incomeMonths=headings(sheets.income),cashMonths=headings(sheets.cashflow);
 const cumulative=!incomeMonths&&!cashMonths;
 const incomeHead=incomeMonths||(cumulative&&sheets.income.find(row=>cumulativeCol(row)>0));
 const cashHead=cashMonths||(cumulative&&sheets.cashflow.find(row=>cumulativeCol(row)>0));

 const balance=[];
 const balanceHead=sheets.balance.findIndex(row=>clean(row[1])==='期末'&&clean(row[4])==='期末');
 if(balanceHead<0)throw Error('找不到资产负债表的期末列');
 for(const row of sheets.balance.slice(balanceHead+1)){
  for(const c of [0,3]){
   const name=str(row[c]),a=optional(row[c+1]),b=optional(row[c+2]);
   if(name&&(a!==null||b!==null))balance.push([name,a,b]);
  }
 }
 function required(rows,name,col){
  const row=rows.find(r=>starts(r[0],name));
  const value=row&&amount(row[col]);
  if(value==null)throw Error('第 '+(col)+' 月对应列的 '+name+' 为空');

  const name=str(r[0]),a=cumulative?null:optional(r[col]),b=optional(r[cumulativeCol(header)]);
  return name&&(a!==null||b!==null)?[[name,a,b]]:[];
 });
 return Array.from({length:cumulative?1:last},(_,i)=>{
  const m=cumulative?last:i+1,inc=cumulative?cumulativeCol(incomeHead):incomeHead.indexOf(m+'月'),cash=cumulative?cumulativeCol(cashHead):cashHead.indexOf(m+'月');
  if(inc<1||cash<1)throw Error('找不到 '+m+' 月列');
  const expense=sum(['销售费用','管理费用','财务费用','研发费用'],name=>{
   const row=sheets.income.find(r=>starts(r[0],name));
   return row?amount(row[inc])??0:0;
  });
  return {id:year+'-'+String(m).padStart(2,'0'),cumulative,
   revenue:required(sheets.income,'营业收入',inc),cost:required(sheets.income,'营业成本',inc),expense,
   operating:required(sheets.income,'营业利润',inc),cash:required(sheets.cashflow,'经营活动产生的现金流量净额',cash),
   company:{balance:m===last?balance:[],income:detail(sheets.income,incomeHead,inc),cashflow:detail(sheets.cashflow,cashHead,cash)}};

}

const followupClose=$('#followup-close');
const dispatchApi='erp/wecom-dispatches';
const dispatchStatus={sending:'发送中',sent:'已发送',failed:'发送失败',unconfirmed:'发送结果待确认'};
const followupTime=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'medium',timeStyle:'medium'});
let followupSequence=0,followupSaving=false,followupPage=1,followupBatch,followupCustomer,feedbackAttempt;
const dispatchDate=value=>followupTime.format(new Date(value));
function followupStatus(message,error=false){
 const element=$('#followup-status');
 element.textContent=message;
 element.className=error?'error':'muted';
}
async function loadFollowup(path,renderData){
 const sequence=++followupSequence;
 followupView.innerHTML='';
 followupStatus('正在加载…');
 try{
  const data=await api(path);
  if(sequence!==followupSequence||!followupDialog.open)return;
  followupStatus('');
  renderData(data);
  $('#followup-heading').focus();
 }catch(error){
  if(sequence===followupSequence&&followupDialog.open){
   followupStatus(error.message,true);
   followupView.innerHTML='<button type="button" data-followup-page="'+followupPage+'">返回推送记录</button>';
  }
 }
}
function showDispatches(page=1){
 followupPage=page;
 return loadFollowup(dispatchApi+'?page='+page,({batches,next})=>{
  followupView.innerHTML=batches.length?grid(['推送时间','接收群','客户数','跟进反馈','状态','操作'],
   batches.map(batch=>[dispatchDate(batch.sent_at||batch.created_at),esc(batch.group_name),batch.customer_count,
     batch.status==='sent'?batch.feedback_count+' / '+batch.customer_count:'—',dispatchStatus[batch.status],
     '<button type="button" data-followup-batch="'+esc(batch.id)+'">查看</button>'])):
   '<p class="empty">暂无推送记录。启用跟进功能后的推送会显示在这里。</p>';
  if(page>1||next)followupView.insertAdjacentHTML('beforeend','<div class="tools">'+
    (page>1?'<button type="button" data-followup-page="'+(page-1)+'">上一页</button>':'')+'<span>第 '+page+' 页</span>'+
    (next?'<button type="button" data-followup-page="'+(page+1)+'">下一页</button>':'')+'</div>');
 });
}
function showDispatch(id){
 return loadFollowup(dispatchApi+'/'+id,data=>{
  followupBatch=data;
  const {batch,rows}=data;
  const sent=batch.status==='sent';
  followupView.innerHTML='<button type="button" data-followup-page="'+followupPage+'">返回推送记录</button>'+
    '<p><b>'+esc(batch.group_name)+'</b> · '+dispatchStatus[batch.status]+' · '+dispatchDate(batch.sent_at||batch.created_at)+'</p>'+
    '<p class="muted">账龄截至 '+esc(batch.as_of)+' · '+rows.length+' 家客户 · 未收合计 '+yuan(batch.total)+
    (sent?' · 已反馈 '+rows.filter(row=>row.feedbackCount).length+' 家':'')+'</p>'+
    '<div class="tools"><label>搜索客户<input id="followup-search" type="search" maxlength="120"></label>'+
    (sent?'<label>反馈状态<select id="followup-filter"><option value="all">全部</option><option value="pending">待反馈</option><option value="done">已反馈</option></select></label>':'')+
    '</div><div id="followup-customers"></div>';
  renderDispatchCustomers();
 });
}
function renderDispatchCustomers(){
 const {batch,rows}=followupBatch;
 const query=$('#followup-search').value.trim().toLowerCase();
 const filter=$('#followup-filter')?.value??'all';
 const sent=batch.status==='sent';
 const matching=rows.filter(row=>row.customer.toLowerCase().includes(query)&&
   (filter==='all'||Boolean(row.feedbackCount)===(filter==='done')));
 $('#followup-customers').innerHTML=grid(['客户','推送时未收金额',...(sent?['反馈记录','操作']:[])],
   matching.map(row=>[esc(row.customer),yuan(row.cents),...(sent?[
     row.feedbackCount?row.feedbackCount+' 条':'待反馈',
     '<button type="button" data-followup-customer="'+row.index+'">'+(row.feedbackCount?'查看 / 添加反馈':'填写反馈')+'</button>']:[])]));
}
function renderFeedback(rows){
 $('#followup-notes').innerHTML=rows.length?'<ul class="followup-notes">'+rows.map(row=>
   '<li><small>'+dispatchDate(row.created_at)+' · '+esc(row.author)+'</small><p>'+esc(row.result)+'</p></li>').join('')+'</ul>':
   '<p class="muted">尚无反馈。</p>';
}
function showCustomerFeedback(index){
 const {batch,rows}=followupBatch;
 const customer=rows.find(row=>row.index===index);
 if(!customer)return;
 followupCustomer=dispatchApi+'/'+batch.id+'/feedback?customer='+index;
 feedbackAttempt=null;
 return loadFollowup(followupCustomer,({feedback})=>{
  followupView.innerHTML='<button type="button" data-followup-batch="'+esc(batch.id)+'">返回客户清单</button>'+
    '<h3>'+esc(customer.customer)+'</h3><p class="muted">推送时未收 '+yuan(customer.cents)+'</p>'+
    '<form id="followup-form"><label>跟进结果<textarea name="result" maxlength="1000" required placeholder="填写客户回复、承诺付款日期或下一步安排"></textarea></label>'+
    '<div class="tools"><button type="submit" class="primary">保存反馈</button></div></form>'+
    '<h3>反馈记录</h3><div id="followup-notes"></div>';
  renderFeedback(feedback);
 });
}
function openFollowup(batchId){
 followupDialog.showModal();
 followupPage=1;
 return batchId?showDispatch(batchId):showDispatches();
}
wecomViewDispatch.addEventListener('click',()=>{
 wecomDialog.close();
 openFollowup(wecomViewDispatch.dataset.dispatchId);
});
followupClose.addEventListener('click',()=>followupDialog.close());
followupDialog.addEventListener('cancel',event=>{if(followupSaving)event.preventDefault()});
followupDialog.addEventListener('close',()=>{if(!followupDialog.open)followupSequence++});
followupView.addEventListener('input',event=>{if(event.target.id==='followup-search')renderDispatchCustomers()});
followupView.addEventListener('change',event=>{if(event.target.id==='followup-filter')renderDispatchCustomers()});
followupView.addEventListener('click',event=>{
 const button=event.target.closest('button');
 if(!button||followupSaving)return;
 if(button.dataset.followupPage)showDispatches(Number(button.dataset.followupPage));
 if(button.dataset.followupBatch)showDispatch(button.dataset.followupBatch);
 if(button.dataset.followupCustomer!==undefined)showCustomerFeedback(Number(button.dataset.followupCustomer));
});
followupView.addEventListener('submit',async event=>{
 if(event.target.id!=='followup-form')return;
 event.preventDefault();
 if(followupSaving)return;
 const field=event.target.elements.result;
 const result=field.value.trim();
 if(!result){followupStatus('请填写跟进结果。',true);field.focus();return}
 if(feedbackAttempt?.result!==result)feedbackAttempt={id:crypto.randomUUID(),result};
 followupSaving=true;followupClose.disabled=true;
 const controls=[...followupView.querySelectorAll('button,textarea')];
 controls.forEach(control=>control.disabled=true);
 followupStatus('正在保存…');
 try{
  const data=await api(followupCustomer,feedbackAttempt);
  field.value='';feedbackAttempt=null;
  renderFeedback(data.feedback);
  followupStatus('已保存反馈。');
 }catch(error){followupStatus(error.message,true)}
 finally{
  followupSaving=false;followupClose.disabled=false;
  controls.forEach(control=>control.disabled=false);
  field.focus();
 }
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='wecom-open'){openWecom();return}
 if(b.id==='followup-open'){openFollowup();return}
 if(b.dataset.tab){if(tab===b.dataset.tab&&tab==='budgets')return;if(!canLeaveBudget())return;tab=b.dataset.tab;erpLegacy=false;erpPage=1;erpQuery='';setTabHash(['skills','ar','budgets','members','ai-models'].includes(tab)?'#'+tab:'');notify('');render();document.querySelector('[data-tab="'+tab+'"]')?.focus();return}
 if(b.id==='bi-voice'){biStartVoice();return}
 if(b.dataset.biExample!==undefined){
  biStopVoice();const input=$('#bi-prompt');input.value=biDraft=biExamples[Number(b.dataset.biExample)];
  input.focus();return;
 }
 if(b.dataset.memberEdit!==undefined){const m=state.members[Number(b.dataset.memberEdit)],form=$('#member');form.elements.email.value=m.email;form.elements.role.value=m.role;form.elements.department.value=m.department??'';form.elements.department.focus();return}
 const skillsRoot=b.closest('#skills-page');
 if(skillsRoot&&(b.id==='skill-new'||b.id==='skill-list'||b.dataset.skillOpen||b.dataset.skillEdit||b.dataset.skillToggle)){
  notify('');
  if(b.id==='skill-new'){renderSkillForm(skillsRoot);return}
  if(b.id==='skill-list'){b.disabled=true;await loadSkills(skillsRoot,true);return}
  const buttons=[...skillsRoot.querySelectorAll('button')];
  buttons.forEach(button=>button.disabled=true);
  try{
   if(b.dataset.skillToggle){
    const published=b.dataset.skillPublished==='1';
    if(published&&!confirm('下架后，同事将暂时无法查看或下载此技能。确定下架？'))return;
    await api('skills/'+b.dataset.skillToggle,{action:published?'unpublish':'publish'});
    if(skillsRoot!==$('#skills-page'))return;
    await showSkill(skillsRoot,b.dataset.skillToggle);
    if(skillsRoot===$('#skills-page'))notify(published?'技能已下架。':'技能已重新发布。');
   }else await showSkill(skillsRoot,b.dataset.skillOpen||b.dataset.skillEdit,Boolean(b.dataset.skillEdit));
  }catch(error){if(skillsRoot===$('#skills-page'))notify(error.message,true)}
  finally{buttons.forEach(button=>button.disabled=false)}
  return;
 }
 if(b.dataset.period){period=b.dataset.period;erpPage=1;render();document.querySelector('[data-period="'+period+'"]')?.focus();return}
 if(b.dataset.biMonth){period=b.dataset.biMonth;render();document.querySelector('[data-bi-month="'+period+'"]')?.focus();return}
 if(b.dataset.biRisk){biRiskMode=b.dataset.biRisk;render();document.querySelector('[data-bi-risk="'+biRiskMode+'"]')?.focus();return}
 if(b.dataset.erpMonth){period=b.dataset.erpMonth;tab='revenue';erpPage=1;erpQuery='';render();return}
 if(b.dataset.erpPage){erpPage=Number(b.dataset.erpPage);loadErpPanel();return}
 if(b.dataset.erpLegacy){erpLegacy=b.dataset.erpLegacy==='1';render();return}
 if(b.dataset.statement){selectStatement(b.dataset.statement);return}
 try{
  if(b.id==='template'){
   const s=specs[kind],url=URL.createObjectURL(new Blob(['\uFEFF'+s.fields.join(',')+'\r\n'+s.sample.join(',')+'\r\n'],{type:'text/csv;charset=utf-8'}));
   const a=document.createElement('a');a.href=url;a.download=s.title+'模板.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  if(b.id==='commit'){b.disabled=true;const result=await api('import',{type:kind==='company'?'report':kind,rows:pending});pending=null;await refresh();notify('已导入 '+result.count+(kind==='company'?' 个月。':' 行。'))}
  if(b.dataset.payment){
   const row=state.ar.find(r=>r.id===b.dataset.payment);
   const value=prompt('登记回款 · '+row.id+' · 当前余额 '+yuan(balance(row))+'。输入人民币金额（元）');
   if(value===null)return;
   b.disabled=true;await api('payment',{id:row.id,amount:cents(value)});await refresh();notify('回款已登记。');
  }
 }catch(error){notify(error.message,true)}finally{b.disabled=false}
});
document.addEventListener('change',async e=>{
 if(['bi-request-model','bi-preferred-model'].includes(e.target.id)){biSetModel(e.target.value);return}
 const el=e.target;
 if(el.id==='skill-category'){skillCategory=el.value;renderSkillResults();return}
 if(el.id==='skill-status'){skillStatus=el.value;skillCategory='';renderSkillList($('#skills-page'));$('#skill-status').focus();return}
 if(el.id==='skill-file'&&el.files[0]){
  const file=el.files[0],form=el.form;
  const submit=form.querySelector('button[type=submit]');submit.disabled=true;
  try{
   if(!/\.md$/i.test(file.name)||file.size>400000)throw Error('请选择有效的 .md 文件（最多 100,000 字符）。');
   const content=await file.text();
   if(!content.trim()||content.length>100000)throw Error('Markdown 文件为空或超过 100,000 字符。');
   if(el.isConnected&&el.files[0]===file){form.elements.markdown.value=content;notify('已导入文件内容。')}
  }catch(error){if(el.isConnected&&el.files[0]===file)notify(error.message,true)}
  finally{if(el.files[0]===file){el.value='';submit.disabled=false}}
  return;
 }
 if(el.id==='periodYear'){period=el.value+period.slice(4);erpPage=1;render();$('#periodYear').focus()}
 if(el.id==='filter'){filter=el.value;render()}
 if(el.id==='kind'){kind=el.value;pending=null;notify('');render()}
 if(el.id==='file'&&el.files[0]){
  const type=kind;pending=null;notify('正在读取文件…');
  try{const rows=await parse(el.files[0],type);if(kind===type){pending=rows;notify('请核对预览后确认导入。')}}
  catch(error){notify(error.message,true)}
  render();
 }
});
document.addEventListener('input',e=>{
 if(e.target.id==='bi-prompt'){biDraft=e.target.value;biStopVoice();return}
 if(e.target.id==='skill-query'){skillQuery=e.target.value;renderSkillResults();return}
 if(e.target.id==='query'){const pos=e.target.selectionStart;query=e.target.value;render();const field=$('#query');field.focus();field.setSelectionRange(pos,pos)}
});
function selectStatement(key){
 statement=key;
 render();
 $('#statement-'+key)?.focus();
}
document.addEventListener('pointerdown',e=>{
 if(!e.target.closest('.ar-metric'))for(const card of document.querySelectorAll('.ar-metric[data-pinned]'))showArMetricHelp(card,false);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')for(const card of document.querySelectorAll('.ar-metric:has(.ar-metric-tip:not([hidden]))'))showArMetricHelp(card,false);
 const key=e.target.dataset.statement;
 if(!key||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 e.preventDefault();
 const i=statementTabs.findIndex(([value])=>value===key),count=statementTabs.length;
 const next={ArrowLeft:(i+count-1)%count,ArrowRight:(i+1)%count,Home:0,End:count-1}[e.key];
 selectStatement(statementTabs[next][0]);
});
document.addEventListener('submit',async e=>{
 if(e.target.id==='bi-request'){e.preventDefault();await biSubmit();return}
 if(e.target.id==='skill-form'){
  e.preventDefault();
  const form=e.target,root=$('#skills-page'),id=form.dataset.skillId;
  const data=Object.fromEntries(new FormData(form));
  if(!data.launch_url.trim()&&!data.markdown.trim()){notify('请提供 HTTPS 使用链接或 SKILL.md 文件内容。',true);form.elements.launch_url.focus();return}
  if(form.querySelector('button[type=submit]').disabled)return;
  const controls=[...form.elements];controls.forEach(control=>control.disabled=true);
  notify('');
  try{
   const result=await api('skills'+(id?'/'+id:''),data);
   if(root!==$('#skills-page'))return;
   if(!id){skillStatus='published';skillCategory='';skillQuery=''}
   await showSkill(root,result.id);
   if(root===$('#skills-page'))notify(id?'技能修改已保存。':'技能已发布，同事现在可以使用。');
  }catch(error){if(root===$('#skills-page'))notify(error.message,true)}
  finally{controls.forEach(control=>control.disabled=false)}
  return;
 }
 if(e.target.id==='erp-search'){e.preventDefault();erpQuery=String(new FormData(e.target).get('q')??'').trim();erpPage=1;loadErpPanel();return}
 if(e.target.id!=='member')return;e.preventDefault();
 const b=e.target.querySelector('button');b.disabled=true;
 try{await api('members',Object.fromEntries(new FormData(e.target)));await refresh();notify('成员权限已更新。')}
 catch(error){notify(error.message,true)}finally{b.disabled=false}
});
window.addEventListener('hashchange',()=>{
 if(!state)return;
 if(!canLeaveBudget()){history.replaceState(null,'','#budgets');return}
 if(location.hash==='#ar'||location.hash.startsWith('#ar?')){tab='ar';erpLegacy=false;erpPage=1;erpQuery='';render()}
 else if(location.hash==='#skills'){tab='skills';render()}
 else if(location.hash==='#ai-models'){tab='ai-models';render()}
 else if(location.hash==='#budgets'){tab='budgets';render()}
 else if(location.hash==='#members'&&state.role==='admin'){tab='members';render()}
 else if(['skills','budgets','members','ai-models'].includes(tab)){tab='dashboard';render()}
});
refresh().catch(error=>{
 $('#view').innerHTML=title('财务管理工作台',esc(error.message))+(localAccounts||demoMode?'':'<a href="/signin-with-chatgpt" target="_top">使用 ChatGPT 登录</a>');
 if(localAccounts)$('#identity').innerHTML=accountActions;
});
let polling=false;
if(!demoMode)setInterval(async ()=>{
 if(polling||!state||document.hidden||!periodTabs.includes(tab))return;
 polling=true;
 const before=state;
 try{
  const next=await api('state');
  if(state===before&&periodTabs.includes(tab)&&JSON.stringify(next)!==JSON.stringify(before)){
   applyState(next);
   if(tab==='dashboard'&&before.role===next.role&&before.email===next.email&&JSON.stringify(before.bi)===JSON.stringify(next.bi)){
    const year=$('#periodYear'),years=[currentPeriod(),period,...periods()].map(value=>value.slice(0,4));
    if(new Set(years).size!==year.options.length||[...year.options].some(option=>!years.includes(option.value))){
     const focus=year===document.activeElement;
     $('.period-control').outerHTML=periodControl();
     if(focus)$('#periodYear').focus();
    }
    const details=[...$('#dashboard-data').querySelectorAll('details')].map(el=>el.open);
    $('#dashboard-data').innerHTML=dashboard();
    $('#dashboard-data').querySelectorAll('details').forEach((el,i)=>{if(details[i])el.open=true});
    return;
   }
   const queryFocused=document.activeElement?.id==='query';
   const pos=queryFocused?document.activeElement.selectionStart:0;
   render();
   if(queryFocused&&$('#query')){$('#query').focus();$('#query').setSelectionRange(pos,pos)}
  }
 }catch(error){notify(error.message,true)}
 finally{polling=false}
},15000);
</script></html>
