function demoApi(path,data){
 if(data!==undefined)throw Error('演示页面为只读。');

 const matches=(...fields)=>fields.some(field=>String(field).toLowerCase().includes(q));
 const rowsPage=rows=>({rows,page:1,next:false});
 switch(url.pathname){
  case '/state': return demoState;
  case '/erp/customers': return rowsPage(demoCustomers.filter(row=>matches(row.customer)));
  case '/erp/orders': {
   const customer=demoCustomers.find(row=>row.customer===get('customer'));
   const n=demoCustomers.indexOf(customer)+1;
   const buckets=[['current','2026-09-13','2026-11-12',0],['days_1_90','2026-07-17','2026-09-15',46],
    ['days_91_180','2026-04-13','2026-06-12',141],['verified_days_181_plus','2026-02-08','2026-04-09',205],
    ['unknown','2026-10-15',null,null]];
   const orders=customer?buckets.flatMap(([bucket,first_day,first_due,max_days],i)=>{
    const order_no='DEMO-SO-'+n+'-'+(i+1),document='DEMO-AR-'+n+'-'+(i+1);
    const estimated=customer[bucket],paid=i===0?customer.paid:0;
    return estimated&&matches(order_no,document)?[{order_no,document,org:'示例主体',first_day,first_due,max_days,unknown:!first_due,
     order_total:estimated+paid,invoiced:estimated+paid,paid,estimated}]:[];
   }):[];
   return {...rowsPage(orders),customer};
  }
  case '/erp/revenue': {
   const month=demoMonths.find(row=>row.id===get('month'));
   const rows=month?[0,1].map(i=>({order_no:'DEMO-REV-'+month.id+'-'+(i+1),date:month.id+'-'+(10+i*10),kind:i?'服务收入':'产品收入',
    customer:demoCustomers[i].customer,net:month.net*(i?.4:.6),gross:month.gross*(i?.4:.6),invoice:'DEMO-INV-'+(i+1)})):[];
   const filtered=rows.filter(row=>matches(row.customer,row.order_no));
   return {...rowsPage(filtered),kinds:filtered.map(row=>({...row,lines:1}))};
  }
  case '/budgets': return {department:demoBudget.department,fill:false,review:false,departments:[demoBudget.department],
   rows:Number(get('year'))===demoYear?[demoBudget]:[]};
  case '/budgets/detail':
   if(Number(get('year'))===demoYear&&get('department')===demoBudget.department)return {budget:demoBudget};
   break;
  case '/skills': return {skills:demoSkills};
 }

 if(skill)return {skill};

}

 arMetric('terms','订单缺账期余额',s.missing_terms,'供订单核对','订单缺账期余额 = 无法确认信用期的订单未结余额之和。','这部分金额已计入订单测算余额。信用期为 0 天时，到期日按 ERP 业务日期计算。')+
 arMetric('difference','账面与订单测算净差',s.difference,'供期末余额核对','账面与订单测算净差 = 账面期末余额 − 订单测算余额。','按平台全量汇总计算，可能含期初未结应收、实际核销和调整差异。',yuan(s.book)+' − '+yuan(s.estimated)+' = '+yuan(s.difference))+'</div>';
}
function showArMetricHelp(card,open){
 if(open){for(const other of document.querySelectorAll('.ar-metric'))if(other!==card)showArMetricHelp(other,false)}
 else delete card.dataset.pinned;
 card.querySelector('.ar-metric-help').setAttribute('aria-expanded',String(open));
 card.querySelector('.ar-metric-tip').hidden=!open;
}
function bindArMetricHelp(){
 for(const card of document.querySelectorAll('.ar-metric')){
  const button=card.querySelector('.ar-metric-help');
  card.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')showArMetricHelp(card,true)});
  card.addEventListener('pointerleave',()=>{if(!card.dataset.pinned&&!button.matches(':focus-visible'))showArMetricHelp(card,false)});
  button.addEventListener('focus',()=>{if(button.matches(':focus-visible'))showArMetricHelp(card,true)});
  button.addEventListener('blur',()=>{if(!card.matches(':hover'))showArMetricHelp(card,false)});
  button.addEventListener('click',()=>{
   const pin=!card.dataset.pinned;
   showArMetricHelp(card,pin);
   if(pin)card.dataset.pinned='1';
  });
 }
}

function biRevenueChart(months,selected){
 const high=Math.max(1,...months.map(r=>r.net)),low=Math.min(0,...months.map(r=>r.net));
 const step=10**Math.floor(Math.log10(high));
 const upper=Math.ceil(high/step)*step;
 const lower=low<0?Math.floor(low/step)*step:0;
 const span=upper-lower,zero=100*upper/span;
 const ticks=[upper,(3*upper+lower)/4,(upper+lower)/2,(upper+3*lower)/4,lower];
 const guides=ticks.map((v,i)=>'<div class="bi-guide" style="--level:'+i*25+'%"><span>'+Math.round(v/1000000).toLocaleString('zh-CN')+'</span></div>').join('');
 const bars=months.map(m=>{
  const chosen=m.id===period;
  const start=m.net>0?100*(upper-m.net)/span:zero;
  const size=100*Math.abs(m.net)/span;
  const label=m.id+' 不含税收入 '+yuan(m.net);
  return '<button type="button" class="bi-month '+(m.net<0?'negative':'')+'" data-bi-month="'+m.id+'" aria-pressed="'+chosen+'" aria-label="'+esc(label)+'" title="'+esc(label)+'"><span class="bi-column" style="--start:'+start+'%;--size:'+size+'%"></span><span class="bi-month-label">'+biPeriod(m.id)+'</span></button>';
 }).join('');
 return '<section class="bi-panel"><div class="bi-panel-head"><div><h2>月度收入趋势</h2><p>'+period.slice(0,4)+' 年 · ERP 不含税 · 万元</p></div>'+
 (selected?'<button type="button" class="bi-text-button" data-erp-month="'+period+'">'+biPeriod(period)+'明细 ↗</button>':'')+'</div>'+
 (months.length?'<div class="bi-chart"><div class="bi-guides" aria-hidden="true">'+guides+'</div><div class="bi-bars" aria-label="点击月份切换收入指标">'+bars+'</div></div>':'<p class="empty">所选年度暂无 ERP 月度收入。</p>')+'</section>';
}

function biAgingChart(aging){
 const buckets=[['未逾期',aging.current,'#147d72'],['逾期 1–90 天',aging.short,'#57aa9c'],['逾期 91–180 天',aging.middle,'#e6a94e'],['逾期 181 天及以上',aging.long,'#d76e53'],['账期待确认',aging.unknown,'#a7b6c6']];
 const total=sum(buckets,([,value])=>value);
 let start=0;
 const stops=buckets.filter(([,value])=>value>0).map(([,value,color])=>{
  const end=start+100*value/total;
  const stop=color+' '+start+'% '+end+'%';
  start=end;
  return stop;
 });
 const gradient=stops.length?'conic-gradient('+stops.join(',')+')':'#e7edf2';
 return '<section class="bi-panel"><div class="bi-panel-head"><div><h2>应收账龄结构</h2><p>按订单到期日测算 · 含账期待确认金额</p></div></div>'+
 '<div class="bi-aging"><div class="bi-donut" style="--segments:'+gradient+'"><div><small>订单测算余额</small><strong>'+biCompact(total)+'</strong></div></div>'+
 '<ul class="bi-legend">'+buckets.map(([label,value,color])=>'<li><i style="--swatch:'+color+'"></i><span>'+label+'</span><b title="'+yuan(value)+'">'+biCompact(value)+'</b></li>').join('')+'</ul></div></section>';
}

 }).join('');
 return '<article class="bi-series"><h3>'+esc(result.label)+'</h3><small>'+esc(result.source)+'</small>'+

function biUpdateVoice(){
 const button=$('#bi-voice');
 if(!button)return;
 button.textContent=biSpeech?'结束语音':'🎙 语音输入';
 button.setAttribute('aria-pressed',String(Boolean(biSpeech)));
 $('#bi-voice-status').textContent=biSpeechStatus;
}
function biStopVoice(){
 if(!biSpeech)return;
 const recognition=biSpeech;
 biSpeech=null;
 biSpeechStatus='';
 try{recognition.abort()}catch{}
 biUpdateVoice();
}
function biStartVoice(){
 if(biSpeech){try{biSpeech.stop()}catch{biStopVoice()}return}
 const Voice=biVoiceType();
 if(!Voice||!window.isSecureContext)return;
 const field=$('#bi-prompt');
 const prefix=field.value.trimEnd();
 let recognition;
 try{recognition=new Voice()}catch{biSpeechStatus='无法启动语音输入，可直接输入文字。';biUpdateVoice();return}
 recognition.lang='zh-CN';
 recognition.interimResults=true;
 recognition.continuous=false;
 let heard=false;
 recognition.onstart=()=>{if(biSpeech===recognition){biSpeechStatus='正在听，请用普通话说出指标需求。';biUpdateVoice()}};
 recognition.onresult=event=>{
  if(biSpeech!==recognition)return;
  const transcript=Array.from(event.results,r=>r[0].transcript).join('').trim();
  if(!transcript)return;
  heard=true;
  biDraft=(prefix?prefix+' '+transcript:transcript).slice(0,300);
  const input=$('#bi-prompt');
  if(input)input.value=biDraft;
 };
 recognition.onerror=event=>{
  if(biSpeech!==recognition)return;
  biSpeech=null;
  biSpeechStatus=['not-allowed','service-not-allowed'].includes(event.error)?'麦克风权限未开启。请允许访问麦克风，或直接输入文字。':
   event.error==='no-speech'?'没有听到语音。请重试或直接输入文字。':'语音识别暂不可用，请重试或直接输入文字。';
  biUpdateVoice();
 };
 recognition.onend=()=>{
  if(biSpeech!==recognition)return;
  biSpeech=null;
  biSpeechStatus=heard?'已填入识别文字，可编辑后生成。':'没有识别到文字，请重试或直接输入。';
  biUpdateVoice();
 };
 biSpeech=recognition;biSpeechStatus='正在启动麦克风…';biUpdateVoice();
 try{recognition.start()}catch{biSpeech=null;biSpeechStatus='无法启动麦克风，可直接输入文字。';biUpdateVoice()}
}
async function biSubmit(){
 if(biBusy)return;
 biStopVoice();
 biDraft=$('#bi-prompt').value;
 if(!biDraft.trim()){$('#bi-prompt').focus();return}
 biBusy=true;biStatus='正在生成指标…';biStatusError=false;
 const version=++biRequestVersion;
 biUpdateRequest();
 try{
  const result=await api('bi/generate',{prompt:biDraft,model:biCurrentModel().id,period});
  if(version!==biRequestVersion)return;
  biResult=result;
  biStatus='指标已生成。再次提交可更新结果。';
  const output=$('#bi-results');
  if(output)output.innerHTML=biRenderResults();
 }catch(error){
  if(version!==biRequestVersion)return;
  biStatus=error.message+(biResult?' 下方保留上一次生成的结果。':'');
  biStatusError=true;
 }finally{if(version===biRequestVersion){biBusy=false;biUpdateRequest()}}
}
function biUpdateRequest(){
 const button=$('#bi-generate');
 if(!button)return;
 button.disabled=biBusy;button.textContent=biBusy?'正在生成…':'生成指标';
 const status=$('#bi-request-status');
 status.textContent=biStatus;
 status.className=biStatusError?'error':'muted';
}

function revenues(){

 const index=reports.indexOf(current);
 const prior=reports[index-1];
 const [year,m]=current.id.split('-').map(Number);
 const previousId=m===1?(year-1)+'-12':year+'-'+String(m-1).padStart(2,'0');

function csv(text){

  const c=text[i];
  if(quote){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quote=false;else field+=c}
  else if(c==='"'&&!field)quote=true;
  else if(c===','){row.push(field);field=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;rows.push([...row,field]);row=[];field=''}

}

async function parse(file,type){

if(!demoMode)setInterval(async ()=>{
 if(polling||!state||document.hidden||!periodTabs.includes(tab))return;
 polling=true;
 const before=state;
 try{
  const next=await api('state');
  if(state===before&&periodTabs.includes(tab)&&JSON.stringify(next)!==JSON.stringify(before)){
   applyState(next);
   if(tab==='dashboard'&&before.role===next.role&&before.email===next.email&&JSON.stringify(before.bi)===JSON.stringify(next.bi)){
    const year=$('#periodYear'),years=[currentPeriod(),period,...periods()].map(value=>value.slice(0,4));
    if(new Set(years).size!==year.options.length||[...year.options].some(option=>!years.includes(option.value))){
     const focus=year===document.activeElement;
     $('.period-control').outerHTML=periodControl();
     if(focus)$('#periodYear').focus();
    }
    const details=[...$('#dashboard-data').querySelectorAll('details')].map(el=>el.open);
    $('#dashboard-data').innerHTML=dashboard();
    $('#dashboard-data').querySelectorAll('details').forEach((el,i)=>{if(details[i])el.open=true});
    return;
   }
   const queryFocused=document.activeElement?.id==='query';
   const pos=queryFocused?document.activeElement.selectionStart:0;
   render();
   if(queryFocused&&$('#query')){$('#query').focus();$('#query').setSelectionRange(pos,pos)}
  }
 }catch(error){notify(error.message,true)}
 finally{polling=false}
},15000);
</script></html>
